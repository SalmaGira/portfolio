[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm start"
  port = 8888
  targetPort = 3000

[context.production.environment]
  NODE_ENV = "production"

# Redirect all requests to index.html (for SPAs)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enforce HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Sitemap and robots.txt
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Custom 404 page
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404