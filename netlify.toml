[build]
  command = "npm run build:clean"
  publish = "dist"

# Force HTTPS redirects
[[redirects]]
  from = "http://keen-moon-snowy.netlify.app/*"
  to = "https://keen-moon-snowy.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.keen-moon-snowy.netlify.app/*"
  to = "https://keen-moon-snowy.netlify.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy with HTTPS enforcement
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https: https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types default dompurify;"
    
    # Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # X-Frame-Options for legacy browser support
    X-Frame-Options = "DENY"
    
    # Cross-Origin-Opener-Policy for origin isolation
    Cross-Origin-Opener-Policy = "same-origin"
    
    # Cross-Origin-Embedder-Policy for additional isolation
    Cross-Origin-Embedder-Policy = "require-corp"
    
    # Cross-Origin-Resource-Policy
    Cross-Origin-Resource-Policy = "same-origin"
    
    # Additional security headers
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), screen-wake-lock=()"
    
    # Performance headers
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    # Specific headers for HTML files with HTTPS enforcement
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https: https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types default dompurify;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "public, max-age=31536000, immutable"

# Additional security redirects
[[redirects]]
  from = "/.well-known/security.txt"
  to = "/security.txt"
  status = 301